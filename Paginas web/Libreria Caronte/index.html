<script>

    fetch('json/JLRGlibros.json')
      .then(response => response.json())
      .then(libros => {
        const contenedor = document.getElementById('catalogo');
        libros.forEach (libro => {
          const card = document.createElement('article');
          card.innerHTML = `
            <p class="tarjetita">${libro.categoria}</p>
                <figure>
                    <img src=${libro.imagen} alt=${libro.imagenCategoria}>
                </figure>
                <p class="titulo">Titulo: ${libro.nombre}</p>
                <p class="autor"> Autor: ${libro.autor}</p>
                <div>
                    <span>${libro.precio}€</span>
                    <button>Comprar</button>
                </div>
          `;
          contenedor.appendChild(card);
        });
      })
  </script>
